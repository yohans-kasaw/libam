services:
  libam-backend:
    build: .
    image: libam-backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      GOOSE_MIGRATION_DIR: ${GOOSE_MIGRATION_DIR}
      GOOSE_DRIVER: ${GOOSE_DRIVER}
      PORT: ${PORT}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      GOOSE_DBSTRING: postgresql://postgres@libam-db/postgres?sslmode=disable
      GIN_MODE: release
    depends_on:
      libam-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:${PORT}/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  libam-db:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 3
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql
