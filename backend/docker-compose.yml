services:
  libam-backend:
    build: .
    image: libam-backend
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      libam-db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      # - ./.env:/secrets/.env
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:${PORT}/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  libam-db:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 3
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql
